<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dos Santos Jesus Study Guide">
<title>Dos Santos Jesus Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a single quiet column; the title is the only statement, the rest is open page waiting for content. */
  :root {
    --bg: #f6f7f9;
    --fg: #1a2130;
    --muted: #5f6878;
    --accent: #34529c;
    --rule: #d9dde5;
    --font-display: "Cormorant Garamond", "Garamond", "Iowan Old Style", Georgia, serif;
    --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151d;
      --fg: #e7e9ef;
      --muted: #9aa2b3;
      --accent: #93abe6;
      --rule: #283041;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151d;
    --fg: #e7e9ef;
    --muted: #9aa2b3;
    --accent: #93abe6;
    --rule: #283041;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 56rem;
    margin: 0 auto;
    padding-block: clamp(3rem, 10vw, 7rem) 3rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: clamp(2.5rem, 6vw, 4rem);
    min-height: 100vh;
    box-sizing: border-box;
  }
  @supports (min-height: 100dvh) { .wrap { min-height: 100dvh; } }

  header {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    padding-bottom: clamp(2rem, 5vw, 3rem);
    border-bottom: 1px solid var(--rule);
  }

  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(3rem, 11vw, 6.5rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }
  h1 .line { display: block; }

  main { flex: 1; }

  .empty {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.375rem;
    color: var(--muted);
  }

  footer {
    font-size: 0.8125rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Study Guide</p>
    <h1><span class="line">Dos Santos</span> <em class="line">Jesus</em></h1>
  </header>

  <main>
    <p class="empty">This page is ready for your notes.</p>
  </main>

  <footer>Dos Santos Jesus Study Guide</footer>
</div>
</body>
</html>
