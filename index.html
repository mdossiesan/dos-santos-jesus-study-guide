<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dos Santos Jesus Study Guide</title>
<meta name="description" content="Welcome to the Dos Santos Jesus Study Guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css?v=7">
<script>(function(d){try{if("IntersectionObserver" in window&&!matchMedia("(prefers-reduced-motion: reduce)").matches){d.classList.add("js-reveal");setTimeout(function(){if(!window.SITE)d.classList.remove("js-reveal")},3000)}}catch(e){}})(document.documentElement);</script>
<style>
  /* Welcome: the name on faint graph paper fills the first screen; scrolling brings up the topic boxes. */
  /* Small name in the top bar */
  .brand {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.25rem;
    line-height: 1.1;
    letter-spacing: 0.005em;
    color: var(--fg);
  }

  .welcome {
    position: relative;
    min-height: calc(100vh - 4.75rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @supports (min-height: 100dvh) {
    .welcome { min-height: calc(100dvh - 4.75rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  }
  .welcome::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 40% 50%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 40% 50%, #000 30%, transparent 75%);
    pointer-events: none;
  }
  .hero {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1rem, 2.5vw, 1.5rem);
    padding-block: 2rem;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(3.25rem, 12vw, 7rem);
    line-height: 0.92;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .hero .sub {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.5rem, 4.5vw, 2.25rem);
    line-height: 1.1;
    color: var(--muted);
  }

  /* Resistor symbol between two terminals */
  .trace {
    display: flex;
    align-items: center;
    max-width: 34rem;
    margin-top: 0.5rem;
    color: var(--accent);
  }
  .trace .term {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    background: var(--bg);
    flex-shrink: 0;
  }
  .trace .wire { flex: 1; height: 1.5px; background: var(--rule); }
  .trace svg { width: 6.5rem; height: 1.25rem; flex-shrink: 0; }

  .welcome > .wrap { width: 100%; }
  .cue {
    position: relative;
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    padding: 0.5rem 0;
    color: var(--muted);
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: none;
  }
  .cue svg { width: 1.125rem; height: 1.125rem; color: var(--accent); animation: nudge 2.2s ease-in-out infinite; }
  .cue:hover { color: var(--fg); }
  .cue:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  /* What do you want to study? */
  .study {
    padding-block: clamp(3.5rem, 10vw, 6rem) clamp(4rem, 10vw, 7rem);
    border-top: 1px solid var(--rule);
    scroll-margin-top: env(safe-area-inset-top, 0px);
  }
  .study .wrap { display: flex; flex-direction: column; gap: 2rem; }
  .study h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.25rem, 7vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    gap: 1rem;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    min-height: 13rem;
    padding: 1.5rem;
    border: 1px solid var(--rule);
    border-radius: 16px;
    background: var(--surface);
    color: var(--fg);
    text-decoration: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover { border-color: var(--accent); box-shadow: var(--lift); transform: translateY(-3px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-icon {
    width: 2.5rem;
    height: 2.5rem;
    margin-bottom: 0.75rem;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .card-icon svg { width: 1.375rem; height: 1.375rem; }
  .card-kicker {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .card-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.75rem;
    line-height: 1.1;
  }
  .card-meta { font-size: 0.875rem; color: var(--muted); }
  .card-go {
    margin-top: auto;
    padding-top: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--accent);
  }
  .card-go svg { width: 1rem; height: 1rem; transition: transform 0.2s ease; }
  .card:hover .card-go svg { transform: translateX(3px); }

  /* First-load entrance for the welcome text */
  @media (prefers-reduced-motion: no-preference) {
    .hero > * { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .hero > :nth-child(2) { animation-delay: 0.08s; }
    .hero > :nth-child(3) { animation-delay: 0.16s; }
    .hero > :nth-child(4) { animation-delay: 0.24s; }
    .cue { animation: rise 0.8s 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .cue svg { animation: nudge 2.2s 1.2s ease-in-out infinite; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cue svg { animation: none; }
    .card, .card-go svg { transition: none; }
  }
</style>
</head>
<body data-page="home">

<header class="topbar">
  <div class="wrap">
    <button class="menu-btn" type="button" data-menu-open aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span class="brand">Dos Santos Jesus</span>
  </div>
</header>

<main>
  <section class="welcome">
    <div class="wrap hero">
      <p class="eyebrow">Welcome to the</p>
      <h1>Electronics Overview</h1>
      <p class="sub">Study Guide</p>
      <div class="trace" aria-hidden="true">
        <span class="term"></span>
        <span class="wire"></span>
        <svg viewBox="0 0 104 20" fill="none"><path d="M0 10h14l5-8 10 16 10-16 10 16 10-16 10 16 10-16 5 8h20" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span class="wire"></span>
        <span class="term"></span>
      </div>
    </div>
    <div class="wrap cue-wrap">
      <a class="cue" href="#study">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M5 11l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Scroll to start studying
      </a>
    </div>
  </section>

  <section class="study" id="study" aria-labelledby="study-title">
    <div class="wrap">
      <h2 class="reveal" id="study-title">What do you want to study?</h2>
      <div class="cards" id="cards"></div>
    </div>
  </section>
</main>

<script src="assets/site.js?v=7" data-root=""></script>
<script>
(function () {
  var SITE = window.SITE;
  var ICON_TOPIC = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12h4l1.5-4 3 8 3-8 3 8 1.5-4H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_ARROW = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function card(href, icon, kicker, title, meta, go) {
    var a = document.createElement("a");
    a.className = "card reveal";
    a.href = href;
    a.innerHTML =
      '<span class="card-icon">' + icon + "</span>" +
      '<span class="card-kicker"></span>' +
      '<span class="card-title"></span>' +
      '<span class="card-meta"></span>' +
      '<span class="card-go"><span></span>' + ICON_ARROW + "</span>";
    a.querySelector(".card-kicker").textContent = kicker;
    a.querySelector(".card-title").textContent = title;
    a.querySelector(".card-meta").textContent = meta;
    a.querySelector(".card-go span").textContent = go;
    return a;
  }

  var cards = document.getElementById("cards");
  SITE.NAV.forEach(function (g) {
    g.items.forEach(function (it) {
      cards.appendChild(card(SITE.root + it.href, ICON_TOPIC, g.group, it.title, it.meta, "Start"));
    });
  });
  SITE.LINKS.forEach(function (l) {
    cards.appendChild(card(SITE.root + l.href, SITE.ICONS[l.icon] || "", "Personal", l.title, l.meta, "Open"));
  });

  Array.prototype.forEach.call(cards.children, function (c, i) {
    c.setAttribute("data-fade-lag", String(i * 40));
  });
  SITE.reveal();

  /* The welcome text drifts up and fades as you scroll down, and comes back as you scroll up */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  var hero = document.querySelector(".hero");
  var cueWrap = document.querySelector(".cue-wrap");
  var ticking = false;
  function scrub() {
    ticking = false;
    var p = Math.min(1, Math.max(0, window.scrollY / (window.innerHeight * 0.6)));
    hero.style.opacity = String(1 - p * 0.85);
    hero.style.translate = "0 " + (-p * 48).toFixed(1) + "px";
    cueWrap.style.opacity = String(Math.max(0, 1 - p * 2.5));
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(scrub); }
  }, { passive: true });
  window.addEventListener("resize", scrub);
  scrub();
})();
</script>
</body>
</html>
