<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DC Quiz</title>
<meta name="description" content="DC Study Guide quiz: one question at a time, in random order. Dos Santos Jesus Study Guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../../assets/site.css?v=7">
<link rel="stylesheet" href="../../../assets/quiz.css?v=2">
<style>
  /* Quiz mode: one question card at a time under a sticky progress bar, then a results card. */
  .qbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .qbar .wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.625rem 1rem;
    padding-block: 0.75rem;
  }
  .qbar-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .qcount { margin: 0; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qcount strong { color: var(--fg); font-weight: 600; }
  .meter { height: 3px; background: var(--rule); }
  .meter span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .page-head.compact { padding-block: 1.75rem 1.25rem; gap: 0.5rem; }
  .page-head.compact h1 { font-size: clamp(2.25rem, 6.5vw, 3rem); }

  .stage { padding-bottom: 4rem; }
  .qcard {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: clamp(1.25rem, 4vw, 2rem);
    border: 1px solid var(--rule);
    border-radius: 18px;
    background: var(--surface);
    min-width: 0;
  }
  .qhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.375rem 0.75rem; }
  .qnum {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.375rem;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .qkind {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .qsrc { margin-left: auto; font-size: 0.75rem; color: var(--muted); }
  .qtitle {
    margin: 0;
    font-size: clamp(1.125rem, 3vw, 1.3125rem);
    font-weight: 600;
    line-height: 1.4;
    text-wrap: pretty;
  }
  .qtitle:focus { outline: none; }
  .next-row { display: flex; justify-content: flex-end; padding-top: 0.25rem; }
  .btn svg { width: 1rem; height: 1rem; }

  /* Card changes: the old one slides out to the left, the new one slides in from the right */
  .qcard.enter { animation: card-in 0.42s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .qcard.leave { animation: card-out 0.22s ease both; }
  @keyframes card-in { from { opacity: 0; translate: 36px 0; } }
  @keyframes card-out { to { opacity: 0; translate: -28px 0; } }

  /* Results */
  .big-score {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(4.5rem, 18vw, 7.5rem);
    line-height: 0.9;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .big-score .of { font-size: 0.42em; color: var(--muted); font-weight: 500; }
  .pct { margin: 0; color: var(--muted); }
  .res-actions { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding-block: 0.5rem; }
  .review-title {
    margin: 0.75rem 0 0;
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .review { list-style: none; margin: 0; padding: 0; }
  .review li {
    display: grid;
    grid-template-columns: 1.5rem minmax(0, 1fr);
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-top: 1px solid var(--rule);
  }
  .rmark { font-weight: 700; text-align: center; }
  .r-right .rmark { color: var(--ok); }
  .r-wrong .rmark { color: var(--no); }
  .r-shown .rmark { color: var(--muted); }
  .rtext { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
  .rt { font-weight: 500; }
  .rn { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .ra { font-size: 0.875rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .qcard.enter, .qcard.leave { animation: none; }
    .meter span { transition: none; }
  }
</style>
</head>
<body data-page="dc-quiz">

<div class="qbar">
  <div class="wrap">
    <div class="qbar-left">
      <button class="menu-btn" type="button" data-menu-open aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <p class="qcount" id="qcount" aria-live="polite"><strong>Question 1 of 22</strong> · 0 right</p>
    </div>
    <a class="btn ghost small" href="../">Exit quiz</a>
  </div>
  <div class="meter" aria-hidden="true"><span id="meter"></span></div>
</div>

<header class="wrap page-head compact">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="../../../">Home</a><span aria-hidden="true">/</span><a href="../">DC Study Guide</a><span aria-hidden="true">/</span><span>Quiz</span></nav>
  <h1>DC Quiz</h1>
</header>

<main class="wrap stage" id="stage"></main>

<script src="../questions.js?v=1"></script>
<script src="../../../assets/quiz-kit.js?v=1"></script>
<script>
(function () {
  const { KIND, el, button, BUILDERS, answerFor } = window.QuizKit;
  const ALL = window.QUIZ_QUESTIONS;
  const REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage");
  const countEl = document.getElementById("qcount");
  const meter = document.getElementById("meter");
  const ARROW = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let order = [];
  let idx = 0;
  let results = [];

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  /* Random order, but a question that refers to another (follows) stays right after it */
  function makeOrder(pool) {
    const inPool = new Set(pool.map(q => q.n));
    const groups = [];
    pool.forEach(q => {
      if (q.follows && inPool.has(q.follows)) return;
      groups.push([q].concat(pool.filter(f => f.follows === q.n)));
    });
    return shuffle(groups).flat();
  }

  function updateBar() {
    const total = order.length;
    const done = results.filter(Boolean).length;
    const right = results.filter(r => r === "right").length;
    countEl.innerHTML = "";
    if (idx >= total) {
      countEl.append(el("strong", null, "Finished"), document.createTextNode(` · ${right} of ${total} right`));
    } else {
      countEl.append(el("strong", null, `Question ${idx + 1} of ${total}`), document.createTextNode(` · ${right} right`));
    }
    meter.style.width = (total ? (done / total) * 100 : 0) + "%";
  }

  /* Swap the card on screen with a slide */
  function swap(render) {
    const old = stage.firstElementChild;
    let done = false;
    const go = () => {
      if (done) return;
      done = true;
      stage.innerHTML = "";
      const node = render();
      stage.appendChild(node);
      if (!REDUCE) node.classList.add("enter");
      updateBar();
      const top = stage.getBoundingClientRect().top + window.scrollY - 120;
      if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: REDUCE ? "auto" : "smooth" });
      const f = node.querySelector("[data-focus]");
      if (f) f.focus({ preventScroll: true });
    };
    if (old && !REDUCE) {
      old.classList.add("leave");
      old.addEventListener("animationend", go, { once: true });
      setTimeout(go, 400);
    } else {
      go();
    }
  }

  function renderQuestion(q, i) {
    const card = el("article", "qcard");
    const head = el("div", "qhead");
    head.append(
      el("span", "qnum", `${i + 1} / ${order.length}`),
      el("span", "qkind", q.kind || KIND[q.type]),
      el("span", "qsrc", `Assessment Q${q.n}`)
    );
    const title = el("h2", "qtitle", q.title);
    title.tabIndex = -1;
    title.setAttribute("data-focus", "");
    card.append(head, title);
    if (q.prompt) card.appendChild(el("p", "prompt", q.prompt));

    const api = { locked: false };
    const b = BUILDERS[q.type](q, api);
    card.appendChild(b.node);

    const hint = el("p", "hint", b.hint);
    const actions = el("div", "actions");
    const checkBtn = button("btn small", "Check answer");
    const showBtn = button("btn small ghost", "Show answer");
    const prog = el("span", "progress");
    checkBtn.hidden = !!b.auto;
    actions.append(checkBtn, showBtn, prog);
    const result = el("p", "result");
    result.hidden = true;
    result.setAttribute("aria-live", "polite");
    const answer = answerFor(q);
    answer.hidden = true;
    const last = i + 1 >= order.length;
    const next = button("btn next");
    next.innerHTML = (last ? "See results" : "Next question") + ARROW;
    next.hidden = true;
    const nextRow = el("div", "next-row");
    nextRow.appendChild(next);
    card.append(hint, actions, result, answer, nextRow);

    api.changed = () => {
      checkBtn.disabled = !b.complete();
      prog.textContent = b.progress();
    };
    function finish(status, detail) {
      api.locked = true;
      b.reveal();
      hint.hidden = true;
      actions.hidden = true;
      result.hidden = false;
      result.className = "result " + status;
      result.textContent = status === "right" ? "Correct!" : status === "wrong" ? ("Not quite. " + (detail || "")).trim() : "Answer shown.";
      answer.hidden = false;
      next.hidden = false;
      results[i] = status;
      updateBar();
      next.focus({ preventScroll: true });
      requestAnimationFrame(() => nextRow.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "nearest" }));
    }
    api.check = () => {
      if (api.locked || !b.complete()) return;
      const g = b.grade();
      finish(g.right ? "right" : "wrong", g.detail);
    };
    checkBtn.addEventListener("click", api.check);
    showBtn.addEventListener("click", () => finish("shown"));
    next.addEventListener("click", () => {
      idx = i + 1;
      swap(idx < order.length ? () => renderQuestion(order[idx], idx) : renderResults);
    });
    api.changed();
    return card;
  }

  function renderResults() {
    const total = order.length;
    const right = results.filter(r => r === "right").length;
    const missed = order.filter((q, i) => results[i] !== "right");
    const card = el("section", "qcard results");

    const h = el("h2", "qtitle", right === total ? "Perfect score!" : "Quiz complete");
    h.tabIndex = -1;
    h.setAttribute("data-focus", "");
    const score = el("p", "big-score");
    score.append(document.createTextNode(String(right)), el("span", "of", ` / ${total}`));
    const pct = el("p", "pct", `${Math.round((right / total) * 100)}% correct`);

    const actions = el("div", "res-actions");
    if (missed.length) {
      const retry = button("btn", `Retry the ${missed.length} you missed`);
      retry.addEventListener("click", () => start(missed));
      actions.appendChild(retry);
    }
    const again = button(missed.length ? "btn ghost" : "btn", "New random quiz");
    again.addEventListener("click", () => start(ALL));
    const back = el("a", "btn ghost", "Back to study guide");
    back.href = "../";
    actions.append(again, back);

    const review = el("ol", "review");
    order.forEach((q, i) => {
      const st = results[i] || "shown";
      const li = el("li", "r-" + st);
      const mark = el("span", "rmark", st === "right" ? "✓" : st === "wrong" ? "✗" : "–");
      mark.setAttribute("aria-label", st === "right" ? "Right" : st === "wrong" ? "Wrong" : "Shown");
      const txt = el("div", "rtext");
      const t = el("span", "rt");
      t.append(el("span", "rn", `Q${q.n} · `), document.createTextNode(q.title));
      txt.appendChild(t);
      if (st !== "right") txt.appendChild(el("span", "ra", "Answer: " + q.key));
      li.append(mark, txt);
      review.appendChild(li);
    });

    card.append(h, score, pct, actions, el("h3", "review-title", "Your answers"), review);
    return card;
  }

  function start(pool) {
    order = makeOrder(pool.slice());
    idx = 0;
    results = [];
    swap(() => renderQuestion(order[0], 0));
  }

  start(ALL);
})();
</script>
<script src="../../../assets/site.js?v=7" data-root="../../../"></script>
</body>
</html>
