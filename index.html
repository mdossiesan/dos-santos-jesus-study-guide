<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dos Santos Jesus Study Guide</title>
<meta name="description" content="Dos Santos Jesus Study Guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* Home: an open page on faint graph paper. The name is the only statement, underlined by a resistor trace. */
  .topbar .wrap { padding-block: 1rem; display: flex; align-items: center; }

  .home {
    position: relative;
    min-height: calc(100vh - 4.75rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  @supports (min-height: 100dvh) {
    .home { min-height: calc(100dvh - 4.75rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  }
  .home::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 40% 50%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 40% 50%, #000 30%, transparent 75%);
    pointer-events: none;
  }

  .hero {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(1.25rem, 3vw, 1.75rem);
    padding-block: 2rem 4rem;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(3.75rem, 15vw, 8.5rem);
    line-height: 0.86;
    letter-spacing: -0.02em;
    display: flex;
    flex-direction: column;
  }
  .hero h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
    padding-left: 0.55em;
  }

  /* Resistor symbol between two terminals */
  .trace {
    display: flex;
    align-items: center;
    max-width: 34rem;
    color: var(--accent);
  }
  .trace .term {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    background: var(--bg);
    flex-shrink: 0;
  }
  .trace .wire { flex: 1; height: 1.5px; background: var(--rule); }
  .trace svg { width: 6.5rem; height: 1.25rem; flex-shrink: 0; }

  .start {
    appearance: none;
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 0.625rem;
    padding: 0.625rem 1rem 0.625rem 0.75rem;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: 500 0.9375rem/1 var(--font-body);
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .start svg { width: 1.125rem; height: 1.125rem; color: var(--accent); }
  .start:hover { color: var(--fg); border-color: var(--accent); }
  .start:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .start { transition: none; }
  }
</style>
</head>
<body data-page="home">

<header class="topbar">
  <div class="wrap">
    <button class="menu-btn" type="button" data-menu-open aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="home">
  <div class="wrap hero">
    <p class="eyebrow">Study Guide</p>
    <h1><span>Dos Santos</span> <em>Jesus</em></h1>
    <div class="trace" aria-hidden="true">
      <span class="term"></span>
      <span class="wire"></span>
      <svg viewBox="0 0 104 20" fill="none"><path d="M0 10h14l5-8 10 16 10-16 10 16 10-16 10 16 10-16 5 8h20" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="wire"></span>
      <span class="term"></span>
    </div>
    <button class="start" type="button" data-menu-open aria-controls="site-menu" aria-expanded="false">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Choose a topic
    </button>
  </div>
</main>

<script src="assets/site.js" data-root=""></script>
</body>
</html>
